---
- name: Install Slurm runtime dependencies
  ansible.builtin.dnf:
    name:
      - hwloc-libs
      - json-c
      - mariadb-connector-c
      - munge
      - numactl-libs
      - pam
      - perl
    state: present

- name: Create the Slurm service group
  ansible.builtin.group:
    name: slurm
    gid: 22001
    system: true
    state: present

- name: Create the Slurm service user
  ansible.builtin.user:
    name: slurm
    uid: 22001
    group: slurm
    system: true
    home: /var/lib/slurm
    create_home: true
    shell: /sbin/nologin
    state: present

- name: Create the Slurm prefix root
  ansible.builtin.file:
    path: /opt/slurm
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the shared Slurm distribution
  ansible.builtin.unarchive:
    src: "/shared/apps/slurm/slurm-{{ lab_slurm_version }}-linux-arm64.tar.gz"
    dest: /opt/slurm
    remote_src: true
    creates: "/opt/slurm/{{ lab_slurm_version }}/bin/sbatch"

- name: Select the pinned Slurm version
  ansible.builtin.file:
    src: "/opt/slurm/{{ lab_slurm_version }}"
    dest: /opt/slurm/current
    state: link
    force: true

- name: Publish Slurm commands in the system path
  ansible.builtin.copy:
    dest: /etc/profile.d/slurm.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      export PATH=/opt/slurm/current/bin:/opt/slurm/current/sbin:$PATH
      export MANPATH=/opt/slurm/current/share/man:${MANPATH:-}

- name: Link Slurm client commands into the non-login system path
  ansible.builtin.file:
    src: "/opt/slurm/current/bin/{{ item }}"
    dest: "/usr/bin/{{ item }}"
    state: link
    force: true
  loop:
    - sacct
    - sacctmgr
    - sbatch
    - scancel
    - sinfo
    - squeue
    - srun

- name: Register Slurm shared libraries
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/slurm.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      /opt/slurm/current/lib
      /opt/slurm/current/lib64
  notify: Refresh dynamic linker cache

- name: Create Slurm and Munge directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/slurm, owner: root, group: root, mode: "0755"}
    - {path: /var/log/slurm, owner: slurm, group: slurm, mode: "0750"}
    - {path: /var/spool/slurmctld, owner: slurm, group: slurm, mode: "0750"}
    - {path: /var/spool/slurmd, owner: root, group: root, mode: "0755"}

- name: Install the shared Munge key
  ansible.builtin.copy:
    src: "{{ lab_root }}/.lab/credentials/munge.key"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  notify: Restart Munge

- name: Configure Slurm
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart Slurm controller
    - Restart Slurm compute daemon

- name: Configure Slurm cgroups
  ansible.builtin.copy:
    dest: /etc/slurm/cgroup.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      CgroupPlugin=autodetect
      ConstrainCores=yes
      ConstrainRAMSpace=yes
      ConstrainDevices=yes
  notify: Restart Slurm compute daemon

- name: Start Munge
  ansible.builtin.systemd_service:
    name: munge
    enabled: true
    state: started

- name: Install MariaDB for Slurm accounting
  ansible.builtin.dnf:
    name: mariadb-server
    state: present
  when: inventory_hostname == 'slurmctl01'

- name: Start MariaDB for Slurm accounting
  ansible.builtin.systemd_service:
    name: mariadb
    enabled: true
    state: started
  when: inventory_hostname == 'slurmctl01'

- name: Create the Slurm accounting database and role
  ansible.builtin.shell: |
    set -euo pipefail
    mysql --protocol=socket <<'SQL'
    CREATE DATABASE IF NOT EXISTS slurm_acct_db;
    CREATE USER IF NOT EXISTS 'slurm'@'localhost' IDENTIFIED BY '{{ lab_mariadb_password }}';
    ALTER USER 'slurm'@'localhost' IDENTIFIED BY '{{ lab_mariadb_password }}';
    GRANT ALL ON slurm_acct_db.* TO 'slurm'@'localhost';
    FLUSH PRIVILEGES;
    SQL
  args:
    executable: /bin/bash
  when: inventory_hostname == 'slurmctl01'
  changed_when: false
  no_log: true

- name: Configure SlurmDBD
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: /etc/slurm/slurmdbd.conf
    owner: slurm
    group: slurm
    mode: "0600"
  when: inventory_hostname == 'slurmctl01'
  no_log: true
  notify: Restart SlurmDBD

- name: Install Slurm systemd units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop:
    - slurmdbd
    - slurmctld
    - slurmd

- name: Apply Slurm handlers before starting daemons
  ansible.builtin.meta: flush_handlers

- name: Start SlurmDBD
  ansible.builtin.systemd_service:
    name: slurmdbd
    daemon_reload: true
    enabled: true
    state: started
  when: inventory_hostname == 'slurmctl01'

- name: Wait for SlurmDBD
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6819
    timeout: 120
  when: inventory_hostname == 'slurmctl01'

- name: Register the lab cluster and synthetic users in accounting
  ansible.builtin.shell: |
    set -euo pipefail
    /opt/slurm/current/bin/sacctmgr -i add cluster jobman-lab || true
    /opt/slurm/current/bin/sacctmgr -i add account lab Description='Jobman Lab' Organization='lab' || true
    /opt/slurm/current/bin/sacctmgr -i add user alice Account=lab || true
    /opt/slurm/current/bin/sacctmgr -i add user bob Account=lab || true
  args:
    executable: /bin/bash
  when: inventory_hostname == 'slurmctl01'
  changed_when: false

- name: Start the Slurm controller
  ansible.builtin.systemd_service:
    name: slurmctld
    daemon_reload: true
    enabled: true
    state: started
  when: inventory_hostname == 'slurmctl01'

- name: Start Slurm compute daemons
  ansible.builtin.systemd_service:
    name: slurmd
    daemon_reload: true
    enabled: true
    state: started
  when: inventory_hostname in ['compute01', 'compute02']
