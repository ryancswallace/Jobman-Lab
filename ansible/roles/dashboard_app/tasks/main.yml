---
- name: Create the isolated Dashboard runtime group
  ansible.builtin.group:
    name: jobman-dashboard-app
    gid: 21903
    state: present

- name: Create the isolated non-login Dashboard runtime user
  ansible.builtin.user:
    name: jobman-dashboard-app
    uid: 21903
    group: jobman-dashboard-app
    create_home: false
    shell: /sbin/nologin
    password_lock: true

- name: Create private application configuration root
  ansible.builtin.file:
    path: /etc/jobman-dashboard-app-lab
    state: directory
    owner: jobman-dashboard-app
    group: jobman-dashboard-app
    mode: "0700"

- name: Inspect existing private Dashboard configuration before changing report mode
  ansible.builtin.stat:
    path: /etc/jobman-dashboard-app-lab/config.json
  register: dashboard_existing_configuration

- name: Read existing report mode without disclosing private configuration
  ansible.builtin.slurp:
    src: /etc/jobman-dashboard-app-lab/config.json
  register: dashboard_existing_configuration_data
  when: dashboard_existing_configuration.stat.exists
  no_log: true

- name: Refuse implicit removal of an enabled report configuration
  ansible.builtin.assert:
    that:
      - (((dashboard_existing_configuration_data.content | b64decode | from_json).reports | default({})).objectRoot | default('')) == ''
    fail_msg: "Reports are already enabled. Reapply with --reports and a reviewed report-capable build."
  when: dashboard_existing_configuration.stat.exists and not dashboard_reports_enabled
  no_log: true

- name: Refuse implicit removal of enabled event and notification processing
  ansible.builtin.assert:
    that:
      - not (((dashboard_existing_configuration_data.content | b64decode | from_json).events | default({})).enabled | default(false))
    fail_msg: "Notifications are already enabled. Reapply with --notifications and a reviewed notification-capable build."
  when: dashboard_existing_configuration.stat.exists and not dashboard_notifications_enabled
  no_log: true

- name: Create private report object storage outside the served application tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: jobman-dashboard-app
    group: jobman-dashboard-app
    mode: "0700"
  loop: [/var/lib/jobman-dashboard-app-lab, /var/lib/jobman-dashboard-app-lab/reports]
  when: dashboard_reports_enabled

- name: Install only the bounded synthetic report redaction policy
  ansible.builtin.copy:
    src: "{{ dashboard_runtime_root }}/redaction.json"
    dest: /etc/jobman-dashboard-app-lab/redaction.json
    owner: jobman-dashboard-app
    group: jobman-dashboard-app
    mode: "0600"
  when: dashboard_reports_enabled
  no_log: true
  notify: Restart isolated Dashboard application

- name: Create the binary application directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/usr/local/libexec/jobman-dashboard-lab]

- name: Inspect static directories without following aliases
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /usr/local
    - /usr/local/share
    - /usr/local/share/jobman-dashboard-lab
    - /usr/local/share/jobman-dashboard-lab/web
  register: dashboard_static_directories

- name: Reject unexpected existing static directory identities
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false))
      - not item.stat.exists or (not (item.stat.islnk | default(false)))
      - not item.stat.exists or (item.stat.uid == 0 and item.stat.gid == 0 and item.stat.mode == '0755')
      - item.item not in ['/usr/local', '/usr/local/share'] or item.stat.exists
    fail_msg: "Static asset directories must be ordinary root-owned 0755 directories."
  loop: "{{ dashboard_static_directories.results }}"

- name: Create only absent static application directories
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ dashboard_static_directories.results }}"
  when: not item.stat.exists

- name: Install exact verified Dashboard binary and build evidence
  ansible.builtin.copy:
    src: "{{ dashboard_application_build }}/{{ item.source }}"
    dest: "/usr/local/libexec/jobman-dashboard-lab/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {source: jobman-dashboard, dest: jobman-dashboard, mode: "0755"}
    - {source: build.json, dest: dashboard-build.json, mode: "0644"}
  notify: Restart isolated Dashboard application

- name: Install the bounded atomic static-tree installer
  ansible.builtin.copy:
    src: install-web-assets.py
    dest: /usr/local/libexec/jobman-dashboard-lab/install-web-assets.py
    owner: root
    group: root
    mode: "0755"

- name: Inspect the initial static entry point without following aliases
  ansible.builtin.stat:
    path: /usr/local/share/jobman-dashboard-lab/web/index.html
    follow: false
  register: dashboard_web_entry

- name: Bootstrap assets only for an empty inactive first installation
  when: not ansible_check_mode and not dashboard_web_entry.stat.exists
  block:
    - name: Create a private initial asset upload
      ansible.builtin.tempfile:
        state: directory
        path: /usr/local/share/jobman-dashboard-lab
        prefix: .web-upload-
      register: dashboard_web_bootstrap_upload

    - name: Copy the verified first-install archive and evidence
      ansible.builtin.copy:
        src: "{{ dashboard_application_build }}/{{ item }}"
        dest: "{{ dashboard_web_bootstrap_upload.path }}/{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop: [web.tar.gz, build.json]

    - name: Install the initial tree without starting an uninitialized service
      ansible.builtin.command:
        argv:
          - python3
          - /usr/local/libexec/jobman-dashboard-lab/install-web-assets.py
          - "{{ dashboard_web_bootstrap_upload.path }}/web.tar.gz"
          - "{{ dashboard_web_bootstrap_upload.path }}/build.json"
          - --bootstrap
      register: dashboard_web_bootstrap
      changed_when: dashboard_web_bootstrap.stdout == 'installed'
  always:
    - name: Remove only this initial asset upload
      ansible.builtin.file:
        path: "{{ dashboard_web_bootstrap_upload.path }}"
        state: absent
      when: dashboard_web_bootstrap_upload.path is defined

- name: Install private application TLS identity and persistence credentials
  ansible.builtin.copy:
    src: "{{ dashboard_runtime_root }}/{{ item.source }}"
    dest: "/etc/jobman-dashboard-app-lab/{{ item.dest }}"
    owner: jobman-dashboard-app
    group: jobman-dashboard-app
    mode: "0600"
  loop:
    - {source: dashboard.json, dest: config.json}
    - {source: dashboard-server.crt, dest: server.crt}
    - {source: dashboard-server.key, dest: server.key}
    - {source: database-url, dest: database-url}
    - {source: web-client-secret, dest: web-client-secret}
    - {source: encryption-key, dest: encryption-key}
    - {source: dashboard-broker-client.crt, dest: broker-client.crt}
    - {source: dashboard-broker-client.key, dest: broker-client.key}
    - {source: dashboard-broker-signing-key.pem, dest: broker-signing-key.pem}
    - {source: control/fixture-ca.crt, dest: control-ca.crt}
    - {source: control/dashboard-client.crt, dest: control-client.crt}
    - {source: control/dashboard-client.key, dest: control-client.key}
    - {source: control/dashboard-signing-key.pem, dest: control-signing-key.pem}
  no_log: true
  notify: Restart isolated Dashboard application

- name: Resolve the approved public Dashboard hostname only inside this guest
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "10.77.0.10 dashboard.lab.test # isolated Dashboard Lab"
    regexp: '^10\.77\.0\.10 dashboard\.lab\.test # isolated Dashboard Lab$'
    state: present

- name: Validate application configuration as its actual service identity
  ansible.builtin.command: sudo -u jobman-dashboard-app /usr/local/libexec/jobman-dashboard-lab/jobman-dashboard --config /etc/jobman-dashboard-app-lab/config.json --mode check-config
  changed_when: false

- name: Apply forward migrations with a transient separate DDL credential
  block:
    - name: Install root-only migration URL for this operation
      ansible.builtin.copy:
        src: "{{ dashboard_runtime_root }}/migration-database-url"
        dest: /etc/jobman-dashboard-app-lab/migration-database-url
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Apply Dashboard migrations using only its dedicated DDL role
      ansible.builtin.command: /usr/local/libexec/jobman-dashboard-lab/jobman-dashboard --config /etc/jobman-dashboard-app-lab/config.json --mode migrate --migration-database-url-file /etc/jobman-dashboard-app-lab/migration-database-url
      changed_when: false
      no_log: true
  always:
    - name: Remove only the transient guest migration credential
      ansible.builtin.file:
        path: /etc/jobman-dashboard-app-lab/migration-database-url
        state: absent
      no_log: true

- name: Apply current-table runtime grants only inside the migrated Dashboard database
  ansible.builtin.command:
    argv: [podman, exec, -i, jobman-postgres, psql, -X, -v, ON_ERROR_STOP=1, -U, jobman_control, -d, jobman_dashboard]
    stdin: |
      DO $$ BEGIN IF current_database() <> 'jobman_dashboard' THEN RAISE EXCEPTION 'Wrong Dashboard database'; END IF; END $$;
      GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO jobman_dashboard;
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO jobman_dashboard;
      REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON public.dashboard_schema_migrations FROM jobman_dashboard;
      GRANT SELECT ON public.dashboard_schema_migrations TO jobman_dashboard;
  delegate_to: pg01
  changed_when: false

- name: Install the isolated Dashboard systemd service
  ansible.builtin.template:
    src: dashboard.service.j2
    dest: /etc/systemd/system/jobman-dashboard-lab-app.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart isolated Dashboard application

- name: Replace the complete verified web tree
  when: not ansible_check_mode
  block:
    - name: Create a private upload directory outside the served tree
      ansible.builtin.tempfile:
        state: directory
        path: /usr/local/share/jobman-dashboard-lab
        prefix: .web-upload-
      register: dashboard_web_upload

    - name: Copy the exact verified archive and its build evidence
      ansible.builtin.copy:
        src: "{{ dashboard_application_build }}/{{ item }}"
        dest: "{{ dashboard_web_upload.path }}/{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop: [web.tar.gz, build.json]

    - name: Validate the archive and compare the entire current asset tree
      ansible.builtin.command:
        argv:
          - python3
          - /usr/local/libexec/jobman-dashboard-lab/install-web-assets.py
          - "{{ dashboard_web_upload.path }}/web.tar.gz"
          - "{{ dashboard_web_upload.path }}/build.json"
          - --check
      register: dashboard_web_check
      changed_when: false

    - name: Close the application's retained static-root descriptor before replacement
      when: dashboard_web_check.stdout == 'different'
      block:
        - name: Stop only the isolated application before deleting displaced assets
          ansible.builtin.systemd_service:
            name: jobman-dashboard-lab-app
            daemon_reload: true
            state: stopped

        - name: Atomically install the complete static tree while the application is stopped
          ansible.builtin.command:
            argv:
              - python3
              - /usr/local/libexec/jobman-dashboard-lab/install-web-assets.py
              - "{{ dashboard_web_upload.path }}/web.tar.gz"
              - "{{ dashboard_web_upload.path }}/build.json"
          register: dashboard_web_install
          changed_when: dashboard_web_install.stdout == 'installed'
      always:
        - name: Reopen the complete static tree even if asset installation failed
          ansible.builtin.systemd_service:
            name: jobman-dashboard-lab-app
            daemon_reload: true
            enabled: true
            state: started
  always:
    - name: Remove only this operation's archive upload
      ansible.builtin.file:
        path: "{{ dashboard_web_upload.path }}"
        state: absent
      when: dashboard_web_upload.path is defined

- name: Start only the isolated Dashboard application
  ansible.builtin.systemd_service:
    name: jobman-dashboard-lab-app
    daemon_reload: true
    enabled: true
    state: started
