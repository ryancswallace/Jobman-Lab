---
- name: Enroll per-user Slurm agents
  hosts: submit
  become: true
  gather_facts: false
  tasks:
    - name: Create the local agent state root
      ansible.builtin.file:
        path: /var/lib/jobman-agent
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create local Slurm agent state directories
      ansible.builtin.file:
        path: "/var/lib/jobman-agent/{{ item.name }}/onprem-slurm"
        state: directory
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: "0700"
      loop: "{{ lab_users }}"

    - name: Classify Slurm agent credential lifetime without exposing credentials
      ansible.builtin.shell: |
        set -euo pipefail
        state="/var/lib/jobman-agent/{{ item.name }}/onprem-slurm"
        if [[ ! -f "$state/credentials.json" ]]; then
          printf 'missing\n'
          exit 0
        fi
        status="$(/usr/local/bin/jobman-agent status --json --state-dir "$state")"
        certificate_expiry="$(jq -er '.status.certificateExpiresAt' <<<"$status")"
        session_expiry="$(jq -er '.status.sessionExpiresAt' <<<"$status")"
        renewal_deadline="$(( $(date --utc +%s) + 60 ))"
        if [[ "$(date --date="$certificate_expiry" +%s)" -le "$renewal_deadline" ||
              "$(date --date="$session_expiry" +%s)" -le "$renewal_deadline" ]]; then
          printf 'expired\n'
        else
          printf 'healthy\n'
        fi
      args:
        executable: /bin/bash
      become_user: "{{ item.name }}"
      environment:
        HOME: "/home/{{ item.name }}"
      loop: "{{ lab_users }}"
      register: slurm_agent_health
      changed_when: false

    - name: Stop Slurm agents with expired credentials
      ansible.builtin.shell: |
        set -euo pipefail
        unit="jobman-agent-slurm-{{ item.item.name }}.service"
        if systemctl is-active --quiet "$unit"; then
          systemctl stop "$unit"
          printf 'stopped\n'
        fi
      args:
        executable: /bin/bash
      loop: "{{ slurm_agent_health.results }}"
      when: item.stdout | trim == 'expired'
      register: stale_slurm_agent_stops
      changed_when: stale_slurm_agent_stops.stdout | default('') | trim == 'stopped'

    - name: Archive expired Slurm agent state
      ansible.builtin.shell: |
        set -euo pipefail
        state="/var/lib/jobman-agent/{{ item.item.name }}/onprem-slurm"
        archive="${state}.expired-$(date --utc +%Y%m%dT%H%M%S)-${RANDOM}"
        mv -- "$state" "$archive"
      args:
        executable: /bin/bash
      loop: "{{ slurm_agent_health.results }}"
      when: item.stdout | trim == 'expired'
      changed_when: true

    - name: Recreate archived Slurm agent state directories
      ansible.builtin.file:
        path: "/var/lib/jobman-agent/{{ item.name }}/onprem-slurm"
        state: directory
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: "0700"
      loop: "{{ lab_users }}"

    - name: Inspect Slurm agent enrollment state
      ansible.builtin.stat:
        path: "/var/lib/jobman-agent/{{ item.name }}/onprem-slurm/credentials.json"
      loop: "{{ lab_users }}"
      register: slurm_agent_states

    - name: Enroll Slurm agents with one-time tokens
      ansible.builtin.command:
        argv:
          - /usr/local/bin/jobman-agent
          - enroll
          - --slurm
          - --state-dir
          - "/var/lib/jobman-agent/{{ item.item.name }}/onprem-slurm"
          - --server
          - "{{ lab_control_endpoint }}"
          - --target-generation
          - "{{ (lookup('file', lab_root + '/.lab/control/target-generations.json') | from_json)['onprem-slurm'] }}"
          - --server-ca
          - /etc/pki/ca-trust/source/anchors/jobman-lab-ca.crt
        stdin: "{{ (lookup('file', lab_root + '/.lab/credentials/enrollment/onprem-slurm-' + item.item.name + '.json') | from_json).spec.token }}\n"
      become_user: "{{ item.item.name }}"
      environment:
        HOME: "/home/{{ item.item.name }}"
      loop: "{{ slurm_agent_states.results }}"
      when: not item.stat.exists
      no_log: true

    - name: Install per-user Slurm agent services
      ansible.builtin.template:
        src: roles/agent/templates/jobman-agent-slurm.service.j2
        dest: "/etc/systemd/system/jobman-agent-slurm-{{ item.name }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ lab_users }}"

    - name: Start per-user Slurm agents
      ansible.builtin.systemd_service:
        name: "jobman-agent-slurm-{{ item.name }}"
        daemon_reload: true
        enabled: true
        state: restarted
      loop: "{{ lab_users }}"

