name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate automation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Ansible and ShellCheck
        run: |
          python -m pip install --disable-pip-version-check --no-input ansible==14.3.1
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Set up Packer
        uses: hashicorp/setup-packer@c4e4b2636b98ce7566f9ec9c309e26821f695bd2
        with:
          version: "1.16.0"

      - name: Run static validation
        run: ./scripts/ci-check.sh
